name: investigate
description: Systematic investigation of a bug, issue, or unexpected behavior

requires:
  - file management
  - code search (optional)
  - git operations (optional)

parameters:
  issue:
    type: string
    required: true
    description: What to investigate — error message, bug description, or unexpected behavior

recipe: |
  Investigate: {{issue}}

  ## Step 1: Gather Context
  - Read any error messages, stack traces, or logs
  - Check ai-memory/MEMORY.md for related known issues or patterns
  - If project-specific rules exist in .cursor/rules/, include them as additional context
  - Identify the affected component/area of code

  ## Step 2: Form Hypotheses
  List 2-3 likely root causes based on the symptoms.
  Rank them by likelihood.

  ## Step 3: Test Hypotheses
  For each hypothesis (most likely first):
  - Search the codebase for relevant code
  - Trace the execution path
  - Check recent changes (git log) if the issue is new
  - Confirm or eliminate the hypothesis

  ## Step 4: Root Cause
  State the confirmed root cause clearly.
  Explain WHY it happens, not just WHAT happens.

  ## Step 5: Fix Options
  Propose 1-2 fix approaches:
  - The quick fix (if applicable)
  - The proper fix
  For each: effort estimate, risk, trade-offs.

  ## Step 6: Report
  Summarize findings:
  - **Issue:** one-line description
  - **Root cause:** what's actually wrong
  - **Fix:** recommended approach
  - **Prevention:** how to avoid this in the future
