name: bootstrap-project
description: Initialize local ai-memory workflow files in the current project

requires:
  - file management

recipe: |
  Set up local ai-memory workflow files for this project:

  1. If ai-memory/MEMORY.md already exists, confirm and stop:
     "Local project memory already exists at ai-memory/MEMORY.md. Nothing to do."

  2. Create directory: ai-memory/design-logs/
  3. Create file: ai-memory/MEMORY.md with these sections:

  ```markdown
  # Project Memory

  ## Decisions
  <!-- Key technical and architectural decisions -->

  ## Patterns
  <!-- Patterns and conventions used in this project -->

  ## Learnings
  <!-- What we've learned working on this project -->

  ## Context
  <!-- Important context about this project -->
  ```

  4. Ask:
     "Should I add `ai-memory/` to .gitignore? (recommended default: yes)"
     - If yes: add `ai-memory/` entry if not already present
     - If no: leave gitignore unchanged

  5. Confirm:
     "Local ai-memory initialized at ai-memory/. Skills stay machine-level in ~/.ai-memory/skills/."
